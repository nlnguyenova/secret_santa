<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#681c30"><title>Secret Santa</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Lora:wght@400;500;600;700&family=Raleway:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="./styles.css"></head><body><canvas id="snow" aria-hidden="true"></canvas><div class="stripes" aria-hidden="true"></div><main class="scene"><header class="masthead"><p class="kicker">A little Christmas tradition</p><h1>Secret <span>Santa</span></h1><p class="subtitle">One little letter. One lovely secret.</p></header><section class="letter-stage"><div class="letter" id="letter"><div class="letter-back"></div><div class="letter-paper"><div class="paper-inner"><p class="paper-kicker" id="paper-kicker">A message just for you</p><div class="sparkle">✳</div><h2 id="paper-heading">Your Christmas<br>secret awaits.</h2><p class="paper-copy" id="paper-copy">Enter your name to open your letter.</p><form id="lookup-form" class="lookup-form"><label class="sr-only" for="username">Enter your name</label><input id="username" maxlength="60" autocomplete="username" required placeholder="Enter your name"><label class="sr-only" for="access-code">Private access code</label><input id="access-code" class="code-input" maxlength="32" autocomplete="one-time-code" required placeholder="Your private code"><button type="submit" id="reveal-button"><span>Open my letter</span><span>↗</span></button></form><p class="message" id="message" role="status" aria-live="polite"></p><div class="recipient-wrap hidden" id="recipient-wrap"><p class="recipient-label">You’re buying a present for</p><p class="recipient" id="recipient-name"></p><p class="secret-note">Psst… keep it a secret. <span>♥</span></p><button type="button" class="text-button" id="close-letter">Fold the letter away</button></div></div></div><div class="envelope"><div class="envelope-back"></div><div class="envelope-left"></div><div class="envelope-right"></div><div class="envelope-bottom"></div><div class="envelope-flap"></div><div class="wax-seal">✦</div><div class="envelope-prompt"><span>For your eyes only</span><strong>Open me</strong></div></div></div></section><p class="footnote">Made with a little magic <span>✳</span></p></main><script src="./app.js" defer></script></body></html>

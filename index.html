
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#681c30">
  <title>Secret Santa</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lora:wght@400;500;600;700&family=Raleway:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <canvas id="snow" aria-hidden="true"></canvas>
  <div class="stripes" aria-hidden="true"></div>

  <main class="scene">
    <header class="masthead">
      <p class="kicker">SSA's</p>
      <h1>Secret <span>Santa</span></h1>
      <p class="subtitle">xxx</p>
    </header>

    <section class="letter-stage">
      <div class="letter" id="letter">
        <div class="letter-back"></div>

        <div class="letter-paper">
          <div class="paper-inner">
            <p class="paper-kicker">The secret letter</p>
            <div class="sparkle">✳</div>

            <h2 id="paper-heading">Who's your<br>Secret Santa?</h2>

            <p class="paper-copy" id="paper-copy">
              Enter your name to discover who you're buying a present for.
            </p>

            <form id="reveal-form" class="lookup-form">
              <label for="participant-name" class="field-label">
                Your name
              </label>

              <input
                id="participant-name"
                name="name"
                type="text"
                maxlength="80"
                autocomplete="off"
                required
                placeholder="Enter your name"
              >

              <button type="submit" id="reveal-button">
                <span>Reveal</span>
                <span>↗</span>
              </button>
            </form>

            <p class="message" id="message" role="status" aria-live="polite"></p>

            <section id="reveal-panel" class="recipient-wrap hidden" aria-live="polite">
              <p class="recipient-label">You're buying a present for</p>
              <p class="recipient" id="recipient-name"></p>
              <p class="secret-note">Psst…</span></p>
            </section>
          </div>
        </div>

        <div class="envelope" id="envelope">
          <div class="envelope-back"></div>
          <div class="envelope-left"></div>
          <div class="envelope-right"></div>
          <div class="envelope-bottom"></div>
          <div class="envelope-flap"></div>
          <div class="wax-seal">✦</div>
          <div class="envelope-prompt">
            <strong>Open me</strong>
          </div>
        </div>
      </div>
    </section>

    <p class="footnote">Made with the help of ChatGPT</span></p>
  </main>

  <script src="./app.js" defer></script>
</body>
</html>
